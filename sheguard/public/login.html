<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHer - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --purple-900:#2D1B4E;
            --purple-800:#3D2570;
            --purple-700:#5B21B6;
            --purple-600:#7C3AED;
            --purple-500:#9333EA;
            --violet-accent:#A855F7;
            --lavender-50:#F7F4FE;
            --lavender-100:#EFE9FC;
            --lavender-200:#E1D6F8;
            --ink:#1A1125;
            --ink-soft:#6B6180;
            --white:#FFFFFF;
            --danger:#E4437A;
            --success:#16A085;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--lavender-50); min-height: 100vh; color: var(--ink); }

        h1, h2, .brand-name, .btn-submit, .nav-login-btn { font-family: 'Poppins', sans-serif; }

        /* Announcement bar */
        .announce-bar {
            background: linear-gradient(90deg, var(--purple-900), var(--purple-700));
            color: #fff;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            padding: 9px 16px;
            letter-spacing: .2px;
        }
        .announce-bar span { margin: 0 6px; }

        /* Top nav */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 5%; background: var(--white); border-bottom: 1px solid var(--lavender-200);
            position: sticky; top: 0; z-index: 50;
        }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .brand-mark { width: 40px; height: 40px; flex-shrink: 0; }
        .logo-text h1 { font-size: 21px; color: var(--purple-700); font-weight: 700; line-height: 1.1; }
        .logo-text span { font-size: 10px; color: var(--ink-soft); display: block; margin-top: 1px; }

        nav ul { display: flex; list-style: none; gap: 32px; }
        nav ul li a { text-decoration: none; color: #4A4458; font-size: 14px; font-weight: 500; transition: color .2s; }
        nav ul li a:hover { color: var(--purple-700); }

        .nav-login-btn {
            background: linear-gradient(135deg, var(--purple-700), var(--purple-600));
            color: #fff; padding: 10px 26px; border-radius: 10px; text-decoration: none;
            font-size: 14px; font-weight: 600; box-shadow: 0 8px 18px rgba(124,58,237,0.28);
        }

        @media (max-width: 860px) { nav { display: none; } }

        /* Page */
        .page-wrap { display: flex; justify-content: center; align-items: center; padding: 60px 20px 70px; }

        .auth-card {
            background: var(--white); border-radius: 18px; width: 100%; max-width: 460px;
            padding: 42px 44px; box-shadow: 0 20px 50px rgba(93,33,182,0.1); border: 1px solid var(--lavender-200);
        }

        .auth-card h2 { font-size: 30px; font-weight: 800; text-align: center; margin-bottom: 26px; color: var(--ink); }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink); margin-bottom: 7px; }
        .form-group label .opt { font-weight: 400; color: var(--ink-soft); font-size: 11.5px; }

        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-wrap svg.leading { position: absolute; left: 14px; width: 17px; height: 17px; color: #8A80A3; pointer-events: none; }
        .input-wrap input {
            width: 100%; padding: 13px 44px 13px 42px; background: var(--white);
            border: 1.5px solid var(--lavender-200); border-radius: 10px; color: var(--ink);
            font-size: 14px; outline: none; transition: border-color .15s ease, box-shadow .15s ease;
        }
        .input-wrap input::placeholder { color: #A79CC0; }
        .input-wrap input:focus { border-color: var(--purple-500); box-shadow: 0 0 0 4px rgba(147,51,234,0.1); }

        .eye-toggle { position: absolute; right: 14px; cursor: pointer; color: #8A80A3; display: flex; }
        .eye-toggle svg { width: 18px; height: 18px; }

        .forgot-link { display: block; text-align: right; margin: -6px 0 18px; font-size: 12.5px; color: var(--purple-700); text-decoration: none; font-weight: 600; }
        .forgot-link:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%; padding: 15px; border: none; border-radius: 10px; cursor: pointer;
            font-size: 15.5px; font-weight: 700; color: #fff;
            background: linear-gradient(135deg, var(--purple-700), var(--purple-600));
            box-shadow: 0 14px 28px rgba(124,58,237,0.3); transition: transform .15s ease;
        }
        .btn-submit:hover { transform: translateY(-1px); }

        .divider { display: flex; align-items: center; gap: 14px; margin: 20px 0 16px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--lavender-200); }
        .divider span { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; letter-spacing: .3px; }

        .switch-line { text-align: center; font-size: 13.5px; color: var(--ink-soft); }
        .switch-line a { color: var(--purple-700); font-weight: 700; text-decoration: underline; cursor: pointer; }

        .error-msg, .success-msg { padding: 11px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; display: none; font-weight: 500; }
        .error-msg { background: rgba(228,67,122,0.08); border: 1px solid var(--danger); color: var(--danger); }
        .success-msg { background: rgba(22,160,133,0.08); border: 1px solid var(--success); color: var(--success); }

        .panel { display: none; }
        .panel.active { display: block; }

        @media (max-width: 480px) {
            .auth-card { padding: 30px 22px; border-radius: 14px; }
            .auth-card h2 { font-size: 24px; }
            header { padding: 12px 16px; }
            .logo-text h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="announce-bar">A Safer Society <span>&middot;</span> A Brighter Tomorrow 💜</div>

    <header>
        <div class="logo-container">
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="url(#brandGrad)"/>
                <circle cx="12" cy="9.3" r="2.3" fill="#fff"/>
                <path d="M7.8 15.5c0-2.1 1.9-3.3 4.2-3.3s4.2 1.2 4.2 3.3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
                <defs><linearGradient id="brandGrad" x1="4" y1="2" x2="20" y2="22"><stop stop-color="#A855F7"/><stop offset="1" stop-color="#5B21B6"/></linearGradient></defs>
            </svg>
            <div class="logo-text">
                <h1>SafeHer</h1>
                <span>Safety. Support. Stronger Together.</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="index.html#how-it-works-target">Services</a></li>
                <li><a href="about.html">Contact</a></li>
            </ul>
        </nav>
        <a href="login.html" class="nav-login-btn">Login</a>
    </header>

    <div class="page-wrap">
        <div class="auth-card">

            <!-- LOGIN PANEL -->
            <div class="panel active" id="panel-login">
                <h2>Login</h2>
                <div class="error-msg" id="login-error"></div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrap">
                        <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M2 7l10 6 10-6"></path></svg>
                        <input type="email" id="email-input" placeholder="Enter your email">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                        <input type="password" id="password-input" placeholder="Enter your password">
                        <span class="eye-toggle" onclick="togglePassword('password-input', 'eye1')" id="eye1">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <a href="#" class="forgot-link">Forgot Password?</a>

                <button class="btn-submit" onclick="handleAuthenticationSubmission()">Login</button>

                <div class="divider"><span>OR</span></div>
                <p class="switch-line">Don't have an account? <a onclick="switchTab('register')">Register</a></p>
            </div>

            <!-- REGISTER PANEL -->
            <div class="panel" id="panel-register">
                <h2>Register</h2>
                <div class="error-msg" id="register-error"></div>
                <div class="success-msg" id="register-success"></div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrap">
                        <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M2 7l10 6 10-6"></path></svg>
                        <input type="email" id="reg-email" placeholder="Enter your email">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password <span class="opt">(min. 6 characters)</span></label>
                    <div class="input-wrap">
                        <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                        <input type="password" id="reg-password" placeholder="Create a password">
                        <span class="eye-toggle" onclick="togglePassword('reg-password', 'eye2')" id="eye2">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrap">
                        <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                        <input type="password" id="reg-confirm" placeholder="Confirm your password">
                        <span class="eye-toggle" onclick="togglePassword('reg-confirm', 'eye3')" id="eye3">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <button class="btn-submit" onclick="handleRegistration()">Register</button>

                <div class="divider"><span>OR</span></div>
                <p class="switch-line">Already have an account? <a onclick="switchTab('login')">Login</a></p>
            </div>

        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + tab).classList.add('active');
        }

        function togglePassword(inputId, eyeId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            if (input.type === 'password') {
                input.type = 'text';
                eye.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19m-6.2-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            } else {
                input.type = 'password';
                eye.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        }

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.innerText = msg;
            el.style.display = 'block';
        }

        function hideMessages(...ids) {
            ids.forEach(id => { document.getElementById(id).style.display = 'none'; });
        }

        async function handleAuthenticationSubmission() {
            hideMessages('login-error');
            const emailField = document.getElementById('email-input').value.trim();
            const passwordField = document.getElementById('password-input').value;

            if (!emailField || !passwordField) {
                return showError('login-error', 'Please enter your email and password.');
            }

            try {
                const queryResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailField, password: passwordField })
                });

                const dataFeedbackResult = await queryResponse.json();

                if (dataFeedbackResult.success) {
                    localStorage.setItem('sheguard_userId', dataFeedbackResult.userId);
                    localStorage.setItem('sheguard_email', dataFeedbackResult.email);
                    window.location.href = 'profile-details.html';
                } else {
                    showError('login-error', dataFeedbackResult.message || 'Authentication rejected.');
                }
            } catch (error) {
                showError('login-error', 'Connection error. Please try again.');
            }
        }

        async function handleRegistration() {
            hideMessages('register-error', 'register-success');
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (!email || !password || !confirm) {
                return showError('register-error', 'All fields are required.');
            }
            if (password !== confirm) {
                return showError('register-error', 'Passwords do not match.');
            }
            if (password.length < 6) {
                return showError('register-error', 'Password must be at least 6 characters.');
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('sheguard_userId', result.userId);
                    localStorage.setItem('sheguard_email', email);
                    const s = document.getElementById('register-success');
                    s.innerText = 'Account created! Redirecting to profile setup...';
                    s.style.display = 'block';
                    setTimeout(() => { window.location.href = 'profile-details.html'; }, 1200);
                } else {
                    showError('register-error', result.message || 'Registration failed.');
                }
            } catch (error) {
                showError('register-error', 'Connection error. Please try again.');
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginPanel = document.getElementById('panel-login');
                const registerPanel = document.getElementById('panel-register');
                if (loginPanel.classList.contains('active')) handleAuthenticationSubmission();
                else if (registerPanel.classList.contains('active')) handleRegistration();
            }
        });
    </script>

</body>
</html>
