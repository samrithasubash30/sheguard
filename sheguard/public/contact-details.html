<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeHer Setup - Trusted Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-900:#2D1B4E;
    --purple-800:#3D2570;
    --purple-700:#5B21B6;
    --purple-600:#7C3AED;
    --purple-500:#9333EA;
    --violet-accent:#A855F7;
    --lavender-50:#F7F4FE;
    --lavender-100:#EFE9FC;
    --lavender-200:#E1D6F8;
    --ink:#241938;
    --ink-soft:#6B6180;
    --white:#FFFFFF;
    --danger:#E4437A;
    --success:#16A085;
    --radius-lg:16px;
    --radius-md:10px;
    --radius-sm:8px;
    --shadow-soft:0 8px 24px rgba(93,33,182,0.08);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--lavender-50);
    color:var(--ink);
    overflow-x:hidden;
  }
  img, svg{max-width:100%;}

  .topbar{
    background:linear-gradient(120deg, var(--purple-800) 0%, var(--purple-600) 60%, var(--violet-accent) 100%);
    color:var(--white);
    padding:0 clamp(16px,4vw,32px);
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 4px 18px rgba(93,33,182,0.18);
  }
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .topbar-left span{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(15px,4vw,17px);letter-spacing:.3px;white-space:nowrap;}

  .page{
    max-width:900px;
    margin:0 auto;
    padding:clamp(16px,4vw,28px) clamp(16px,4vw,32px) clamp(40px,8vw,80px);
    width:100%;
  }

  .page-head{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:22px;
    gap:16px;
  }
  .page-head h1{
    font-family:'Poppins',sans-serif;
    font-size:clamp(19px,4.5vw,24px);
    font-weight:700;
    margin:0 0 4px;
    color:var(--ink);
  }
  .page-head p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .breadcrumb{
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:6px;
  }
  .breadcrumb span{color:var(--purple-600);}

  .step-track{
    display:flex;
    align-items:center;
    gap:0;
    background:var(--white);
    border:1px solid var(--lavender-200);
    border-radius:99px;
    padding:6px;
    box-shadow:var(--shadow-soft);
    max-width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    margin-bottom:24px;
  }
  .step-track::-webkit-scrollbar{display:none;}
  .step{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border-radius:99px;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .step .num{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--lavender-100);
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
  }
  .step.active{
    background:linear-gradient(135deg,var(--purple-700),var(--purple-600));
    color:var(--white);
  }
  .step.active .num{background:rgba(255,255,255,0.25);color:var(--white);}
  .step-sep{width:26px;height:1.5px;background:var(--lavender-200);flex-shrink:0;}

  .save-status{
    font-size:13px;
    padding:12px 16px;
    border-radius:var(--radius-md);
    display:none;
    font-weight:600;
    margin-bottom:20px;
  }
  .save-status.error{ background:rgba(228,67,122,0.1); border:1px solid var(--danger); color:var(--danger); }
  .save-status.success{ background:rgba(22,160,133,0.1); border:1px solid var(--success); color:var(--success); }

  .panel{
    background:var(--white);
    border:1px solid var(--lavender-200);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
    padding:clamp(18px,4vw,24px) clamp(16px,4vw,26px) clamp(16px,4vw,22px);
    min-width:0;
    margin-bottom:20px;
    position:relative;
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:18px;
  }
  .panel-head h2{
    font-family:'Poppins',sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--purple-700);
    margin:0;
  }
  .panel-head .tag{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--purple-600);
    background:var(--lavender-100);
    border:1px solid var(--lavender-200);
    border-radius:99px;
    padding:3px 10px;
  }
  .panel-head-right{display:flex;align-items:center;gap:10px;}
  .delete-contact-btn{
    width:30px;height:30px;
    border-radius:50%;
    border:1px solid var(--lavender-200);
    background:var(--lavender-50);
    color:var(--danger);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, border-color .15s ease;
  }
  .delete-contact-btn:hover{background:rgba(228,67,122,0.1);border-color:var(--danger);}
  .delete-contact-btn svg{width:14px;height:14px;}

  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    min-width:0;
  }
  .field{margin-bottom:16px;min-width:0;}
  .field:last-child{margin-bottom:0;}
  .field-row .field{margin-bottom:0;}

  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  label .req{color:var(--danger);margin-left:2px;}
  label .opt{font-weight:400;color:var(--ink-soft);font-size:11.5px;font-style:italic;margin-left:4px;}

  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .input-wrap svg{
    position:absolute;
    left:13px;
    width:16px;height:16px;
    color:var(--purple-500);
    pointer-events:none;
  }
  input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    background:var(--lavender-50);
    border:1.5px solid var(--lavender-200);
    border-radius:var(--radius-md);
    padding:11px 12px 11px 38px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
    appearance:none;
  }
  input::placeholder{color:#A79CC0;}
  input:focus{
    background:var(--white);
    border-color:var(--purple-500);
    box-shadow:0 0 0 4px rgba(147,51,234,0.10);
  }

  .add-row-btn{
    width:100%;
    border:1.5px dashed var(--purple-500);
    background:var(--lavender-50);
    color:var(--purple-700);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:14px;
    border-radius:var(--radius-md);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    margin-bottom:24px;
  }
  .add-row-btn svg{width:16px;height:16px;}

  .action-bar{
    position:sticky;
    bottom:0;
    margin-top:4px;
    background:rgba(247,244,254,0.9);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--lavender-200);
    padding:16px 0 0;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .footer-tag{
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:500;
  }
  .footer-tag svg{width:14px;height:14px;color:var(--purple-500);}
  .btn-back{
    color:var(--ink-soft);
    text-decoration:none;
    font-size:13px;
    font-weight:600;
  }
  .submit-btn{
    border:none;
    cursor:pointer;
    padding:12px 28px;
    border-radius:99px;
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--white);
    background:linear-gradient(135deg, var(--purple-700), var(--purple-600) 50%, var(--violet-accent));
    box-shadow:0 12px 26px rgba(124,58,237,0.28);
    display:flex;align-items:center;gap:8px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(124,58,237,0.36);}
  .submit-btn svg{width:16px;height:16px;}

  @media (max-width:768px){
    .page-head{align-items:flex-start;}
    .step-track{width:100%;}
  }

  @media (max-width:640px){
    .field-row{grid-template-columns:1fr;}
    .page{padding:16px 14px 50px;}
    .topbar{padding:0 14px;height:56px;}
    input{font-size:16px;padding:12px 12px 12px 40px;}
    .action-bar{flex-direction:column;align-items:stretch;gap:15px;}
    .submit-btn{justify-content:center;}
    .btn-back{text-align:center;}
    .step{padding:8px 12px;font-size:12px;}
    .step-sep{width:16px;}
  }

  @media (max-width:400px){
    .page-head h1{font-size:18px;}
    .topbar-left span{font-size:15px;}
    .panel{padding:16px 14px 14px;}
    .step{padding:8px 10px;font-size:11.5px;}
    .step .num{width:20px;height:20px;font-size:10px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="#ffffff" fill-opacity="0.95"/>
        <path d="M9 12.2l2 2 4-4.2" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span>SafeHer</span>
  </div>
</div>

<div class="page">

  <div class="page-head">
    <div>
      <div class="breadcrumb">Onboarding <span>&rsaquo;</span> Trusted Circle</div>
      <h1>Trusted Circle</h1>
      <p>Add up to 5 emergency contacts who'll be notified during an SOS</p>
    </div>
  </div>

  <div class="step-track">
    <div class="step"><span class="num">1</span>Personal Profile</div>
    <div class="step-sep"></div>
    <div class="step active"><span class="num">2</span>Trusted Circle</div>
  </div>

  <div class="save-status" id="save-status"></div>

  <div id="contacts-wrapper"></div>

  <button type="button" class="add-row-btn" onclick="addNewContactCard()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    Add Another Contact <span style="font-weight:400;color:var(--ink-soft);">(up to 5)</span>
  </button>

  <div class="action-bar">
    <a href="profile-details.html" class="btn-back">&#8592; Back to Profile</a>
    <button class="submit-btn" onclick="saveAndFinalize()">
      Finish Setup
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </button>
  </div>

</div>

<script>
    // Guard: redirect to login if no session
    const userId = localStorage.getItem('sheguard_userId');
    if (!userId) { window.location.href = 'login.html'; }

    let contactCount = 0;

    function createContactCard(num, data = {}) {
        const card = document.createElement('div');
        card.className = 'panel';
        card.innerHTML = `
            <div class="panel-head">
                <h2>Contact ${num}</h2>
                <div class="panel-head-right">
                    <span class="tag">Guardian ${num}</span>
                    <button type="button" class="delete-contact-btn" title="Remove this contact" onclick="removeContactCard(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
                    </button>
                </div>
            </div>
            <div class="field-row" style="margin-bottom:16px;">
                <div class="field">
                    <label>Contact Name<span class="req">*</span></label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" class="c-name" placeholder="Name" value="${data.name || ''}">
                    </div>
                </div>
                <div class="field">
                    <label>Relationship<span class="opt">Optional</span></label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
                        <input type="text" class="c-rel" placeholder="e.g. Mother, Father, Friend..." value="${data.relationship || ''}">
                    </div>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Mobile Number<span class="req">*</span></label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.8 2.2z"></path></svg>
                        <input type="tel" class="c-phone" placeholder="Phone number" value="${data.phone || ''}">
                    </div>
                </div>
                <div class="field">
                    <label>Backup Number<span class="opt">Optional</span></label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.8 2.2z"></path></svg>
                        <input type="tel" class="c-backup" placeholder="Secondary number" value="${data.backup_phone || ''}">
                    </div>
                </div>
            </div>
        `;
        return card;
    }

    function addNewContactCard(data = {}) {
        if (contactCount >= 5) {
            showStatus('error', 'Maximum of 5 contacts reached.');
            return;
        }
        contactCount++;
        const wrapper = document.getElementById('contacts-wrapper');
        wrapper.appendChild(createContactCard(contactCount, data));
    }

    function removeContactCard(button) {
        const card = button.closest('.panel');
        if (card) {
            card.remove();
            contactCount--;
        }
    }

    // Pre-fill existing contacts from database
    async function loadExistingContacts() {
        try {
            const response = await fetch(`/api/dashboard/data/${userId}`);
            const result = await response.json();
            if (result.success && result.contacts.length > 0) {
                result.contacts.forEach(c => addNewContactCard(c));
            } else {
                addNewContactCard(); // Start with one blank card
            }
        } catch (err) {
            addNewContactCard(); // Start with one blank card on error
        }
    }

    loadExistingContacts();

    function showStatus(type, msg) {
        const el = document.getElementById('save-status');
        el.className = 'save-status ' + type;
        el.innerText = msg;
        el.style.display = 'block';
    }

    async function saveAndFinalize() {
        const cards = document.querySelectorAll('.panel');
        const dynamicContactsPool = [];

        cards.forEach(card => {
            const name = card.querySelector('.c-name').value.trim();
            const relationship = card.querySelector('.c-rel').value.trim();
            const phone = card.querySelector('.c-phone').value.trim();
            const backup_phone = card.querySelector('.c-backup').value.trim();
            dynamicContactsPool.push({ name, relationship, phone, backup_phone });
        });

        const validContacts = dynamicContactsPool.filter(c => c.name && c.phone);
        if (validContacts.length === 0) {
            return showStatus('error', 'Please add at least one contact with a name and phone number.');
        }

        try {
            const response = await fetch('/api/contacts/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: userId,
                    contactsList: dynamicContactsPool
                })
            });

            const result = await response.json();

            if (result.success) {
                showStatus('success', `${validContacts.length} contacts saved! Launching dashboard...`);
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
            } else {
                showStatus('error', result.message || 'Failed to save contacts.');
            }
        } catch (err) {
            showStatus('error', 'Connection error. Please try again.');
        }
    }
</script>
</body>
</html>
